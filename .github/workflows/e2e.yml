name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: timezone-app

jobs:
  # The gate. Everything here passes against the app as it stands today, so a red
  # build means "this change broke something", not "the app still has its backlog".
  regression-gate:
    name: Regression gate (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: timezone-app/package-lock.json

      - run: npm ci

      - name: Typecheck
        if: matrix.browser == 'chromium'
        run: npm run typecheck

      - name: Lint
        if: matrix.browser == 'chromium'
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run regression gate
        run: npm run e2e:gate -- --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-gate-${{ matrix.browser }}
          path: timezone-app/playwright-report/
          retention-days: 14

  # The backlog. These tests assert the specification and fail because the app does
  # not meet it yet, each one tied to an issue in docs/ISSUES.md.
  #
  # The job is expected to be red and does not block: continue-on-error keeps the
  # overall run green so the gate above stays the thing that matters. What this job
  # is really for is the step after the suite, which names any individual known-bug
  # test that has started passing - that is the signal a fix has landed and an issue
  # can be closed.
  known-bugs:
    name: Known bugs (reporting only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: timezone-app/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # No step-level continue-on-error: the step should fail while defects are open,
      # so this job reports red honestly rather than showing a green that means nothing.
      - name: Run known-bug suite
        run: npm run e2e:known-bugs -- --reporter=json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: known-bugs.json

      # Runs whether or not the suite failed, which is the point: it inspects each
      # result individually rather than only knowing whether the whole lane passed.
      - name: Report any known bug that now passes
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("known-bugs.json")) {
              console.log("No report produced; nothing to check.");
              process.exit(0);
            }
            const report = JSON.parse(fs.readFileSync("known-bugs.json", "utf8"));
            const fixed = [];
            const walk = (suites) => {
              for (const s of suites ?? []) {
                for (const spec of s.specs ?? []) {
                  for (const t of spec.tests ?? []) {
                    if (t.results?.[0]?.status === "passed") {
                      fixed.push(`${spec.title} [${t.projectName}]`);
                    }
                  }
                }
                walk(s.suites);
              }
            };
            walk(report.suites);
            if (fixed.length === 0) {
              console.log("All known-bug tests still fail, as expected.");
            } else {
              for (const name of fixed) {
                console.log(`::warning::FIXED: ${name} now passes. Close the matching issue in docs/ISSUES.md and remove its @known-bug tag so it joins the regression gate.`);
              }
            }
          '

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-known-bugs
          path: |
            timezone-app/playwright-report/
            timezone-app/known-bugs.json
          retention-days: 14
